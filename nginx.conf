server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirigir todas las rutas al index.html para que Angular maneje el enrutamiento
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché opcional para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}